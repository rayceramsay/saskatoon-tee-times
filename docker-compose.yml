# Local-only infrastructure. Production DynamoDB is provisioned via OpenTofu; this
# stands up an equivalent table store on the developer's machine so the
# scraper-local entrypoint has somewhere to write.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: stt-dynamodb-local
    working_dir: /home/dynamodblocal
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', './data']
    ports:
      - '8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
